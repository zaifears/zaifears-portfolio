      const tl = gsap.timeline({ paused: true });

        { x: -460, opacity: 0 },
        { x: 0, opacity: 1, duration: 1.75, ease: "power3.out" },
        0.1
      );

      // Walk bounce (4 stride steps)
      for (let i = 0; i < 4; i++) {
        const t = 0.15 + i * 0.38;
        tl.fromTo(
          "#s1-body-group",
          { y: 0 },
          { y: -14, duration: 0.18, ease: "power2.out" },
          t
        ).to(
          "#s1-body-group",
          { y: 0, duration: 0.18, ease: "power2.in" },
          t + 0.18
        );

        const swing = i % 2 === 0 ? 18 : -18;
        tl.fromTo(
          "#s1-leg-l",
          { rotation: -swing, svgOrigin: "180 300" },
          { rotation: swing, svgOrigin: "180 300", duration: 0.36, ease: "sine.inOut" },
          t
        );
        tl.fromTo(
          "#s1-leg-r",
          { rotation: swing, svgOrigin: "180 300" },
          { rotation: -swing, svgOrigin: "180 300", duration: 0.36, ease: "sine.inOut" },
          t
        );
        tl.fromTo(
          "#s1-arm-l",
          { rotation: swing * 0.7, svgOrigin: "180 198" },
          { rotation: -swing * 0.7, svgOrigin: "180 198", duration: 0.36, ease: "sine.inOut" },
          t
        );
      }

      // Settle legs & left arm cleanly at t=1.7s
      tl.to("#s1-leg-l", { rotation: 0, svgOrigin: "180 300", duration: 0.25, ease: "power2.out" }, 1.7);
      tl.to("#s1-leg-r", { rotation: 0, svgOrigin: "180 300", duration: 0.25, ease: "power2.out" }, 1.7);
      tl.to("#s1-arm-l", { rotation: 0, svgOrigin: "180 198", duration: 0.25, ease: "power2.out" }, 1.7);

      // Right arm raises and gives a friendly 3-cycle wave (1.7s -> 4.3s)

        "#s1-arm-r",
        { rotation: 46, svgOrigin: "180 198" },
        { rotation: -8, svgOrigin: "180 198", duration: 0.45, ease: "back.out(1.6)" },
        1.65
      );
      tl.fromTo(
        "#s1-wave-arcs",
        { opacity: 0, scale: 0.7, svgOrigin: "310 95" },
        { opacity: 1, scale: 1, svgOrigin: "310 95", duration: 0.25, ease: "power2.out" },
        2.0
      );

      for (let w = 0; w < 3; w++) {
        const wt = 2.1 + w * 0.55;
        tl.to("#s1-arm-r", { rotation: 16, svgOrigin: "180 198", duration: 0.26, ease: "sine.inOut" }, wt)

      // Friendly head tilt + blink

        "#s1-head",
        { rotation: 0, svgOrigin: "180 165" },
        { rotation: 6, svgOrigin: "180 165", duration: 0.45, ease: "power2.out" },

      tl.fromTo(
        "#s1-eyes",
        { scaleY: 1, svgOrigin: "180 108" },
        { scaleY: 0.1, svgOrigin: "180 108", duration: 0.08, ease: "power2.in" },
        3.2
      ).to("#s1-eyes", { scaleY: 1, svgOrigin: "180 108", duration: 0.1, ease: "power2.out" }, 3.29);

        "#s1-badge",
        { y: 26, opacity: 0 },

      tl.to("#s1-camera", { opacity: 0, x: -40, duration: 0.45, ease: "power2.in" }, 5.5);

      window.__timelines["scene-1-hook"] = tl;
      tl.seek(0);
    })();
